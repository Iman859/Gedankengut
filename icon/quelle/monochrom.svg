<!--
  App-Icon „Kopf voller Sterne“ – MONOCHROM-EBENE (Android 13+ „Designsymbole“)

  Wenn am Pixel „Designsymbole“ eingeschaltet sind, färbt Android alle Icons
  einheitlich passend zum Hintergrundbild ein. Dafür nutzt es nur diese Ebene –
  und davon nur die Deckkraft (Alpha), nicht die Farbe. Deshalb: alles weiß,
  ohne Füllung und ohne Leuchten, nur Kontur + Sterne.

  Koordinaten wie in vordergrund.svg (gleiche Lage, gleiche Größe – inklusive
  der Verschiebung um 8 nach links für die optische Mitte).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 300 300" width="1024" height="1024">
  <defs>
    <clipPath id="kopfRand">
      <path d="M42 92 V79 C31 73 24 61 25 46 C26 27 40 14 57 14 C72 14 81 25 81 37 C81 41 80 44 82 47 L86 54 C87 56 86 58 83 58 V64 C83 68 80 70 76 70 H71 V92 Z"/>
    </clipPath>
  </defs>

  <g transform="translate(8 16) scale(1.68)" fill="#FFFFFF">
    <!-- Sterne (gleiche Positionen wie im Vordergrund, alle weiß) -->
    <g clip-path="url(#kopfRand)">
      <circle cx="41.5" cy="43.8" r="0.90" opacity="0.85"/>
      <circle cx="34.6" cy="22.5" r="1.27" opacity="0.82"/>
      <circle cx="39.7" cy="50.7" r="1.03" opacity="0.76"/>
      <circle cx="66.4" cy="31.3" r="0.72" opacity="0.9"/>
      <circle cx="58.9" cy="24.6" r="1.21" opacity="0.72"/>
      <circle cx="33.2" cy="56.6" r="0.98" opacity="0.89"/>
      <circle cx="68.8" cy="37.8" r="1.24" opacity="0.99"/>
      <circle cx="37.4" cy="36.6" r="0.63" opacity="0.69"/>
      <circle cx="70.6" cy="39.4" r="1.10" opacity="0.77"/>
      <circle cx="65.3" cy="45.0" r="1.03" opacity="0.83"/>
      <circle cx="68.2" cy="49.3" r="1.34"/>
      <circle cx="58.9" cy="28.5" r="1.29" opacity="0.89"/>
      <circle cx="40.4" cy="55.3" r="1.06" opacity="0.65"/>
      <circle cx="51.3" cy="47.6" r="0.99" opacity="0.92"/>
      <path d="M52 32 Q52 38 58 38 Q52 38 52 44 Q52 38 46 38 Q52 38 52 32 Z"/>
      <path d="M64 24.5 Q64 28 67.5 28 Q64 28 64 31.5 Q64 28 60.5 28 Q64 28 64 24.5 Z"/>
      <path d="M42 49 Q42 52 45 52 Q42 52 42 55 Q42 52 39 52 Q42 52 42 49 Z"/>
    </g>
    <!-- Kontur des Kopfes -->
    <path d="M42 92 V79 C31 73 24 61 25 46 C26 27 40 14 57 14 C72 14 81 25 81 37 C81 41 80 44 82 47 L86 54 C87 56 86 58 83 58 V64 C83 68 80 70 76 70 H71 V92" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
