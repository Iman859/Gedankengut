<!--
  App-Icon „Kopf voller Sterne“ – VORDERGRUND-EBENE (adaptives Android-Icon)

  Inhalt: Kopf im Profil, gefüllt mit Nachthimmel, Sterne im Gehirnbereich,
  Leuchtkontur von Ultramarin nach Magenta – exakt der Entwurf M6 der Leinwand.
  Hintergrund ist durchsichtig (der liegt in hintergrund.svg).

  Koordinaten: siehe Erklärung in hintergrund.svg (viewBox "-50 -50 300 300",
  sichtbarer Kreis = 0..200). Der Entwurf zeichnet den Kopf in einem eigenen
  100er-Raster, das mit 168 Einheiten Breite liegt → scale(1.68).

  Optische Mitte: Im Entwurf lag das Raster genau mittig (translate 16 16).
  Weil das Profil nach rechts schaut (Nase, Kinn), lag der Kopf dadurch
  sichtbar zu weit rechts: gemessener Schwerpunkt x = 108, Mitte des Umrisses
  x = 109,5 (Icon-Mitte = 100). Deshalb 8 Einheiten nach links verschoben
  → transform="translate(8 16) scale(1.68)". Jetzt: Schwerpunkt ≈ 100.
  (Gleiche Verschiebung in monochrom.svg!)

  Schutzzone: Android garantiert nur einen Kreis von 66 dp (≙ Radius ≈ 92 um
  den Mittelpunkt 100/100) als immer sichtbar. Der äußerste Punkt des Kopfes
  (Halsende unten links) liegt ≈ 74 Einheiten vom Mittelpunkt entfernt → passt.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 300 300" width="1024" height="1024">
  <defs>
    <!-- Verlauf der Leuchtkontur: Ultramarin-Lila oben links → Magenta unten rechts -->
    <linearGradient id="kontur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A7CFF"/>
      <stop offset="1" stop-color="#E08CFF"/>
    </linearGradient>

    <!-- Füllung des Kopfes: ein Stück Nachthimmel, leicht durchscheinend,
         damit das Leuchten darunter lila durchschimmert. -->
    <radialGradient id="kopfHimmel" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#3B3FC8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#140F4A" stop-opacity="0.9"/>
    </radialGradient>

    <!-- Umriss des Kopfes (geschlossen), damit Sterne nicht über den Rand ragen. -->
    <clipPath id="kopfRand">
      <path d="M42 92 V79 C31 73 24 61 25 46 C26 27 40 14 57 14 C72 14 81 25 81 37 C81 41 80 44 82 47 L86 54 C87 56 86 58 83 58 V64 C83 68 80 70 76 70 H71 V92 Z"/>
    </clipPath>

    <!--
      Das Leuchten. Im Entwurf waren es drei hintereinandergeschaltete CSS-Schatten:
        drop-shadow(0 0 2px  rgba(200,190,255,0.9))   heller, enger Kern
        drop-shadow(0 0 8px  rgba(91,75,255,1))       Ultramarin-Schein
        drop-shadow(0 0 20px rgba(192,77,255,0.7))    weiter Magenta-Hof
      „Hintereinander“ heißt: jeder Schatten wirft wieder einen Schatten vom
      Ergebnis davor. Genau das bauen wir hier Schritt für Schritt nach.
      Umrechnung: CSS-Unschärfe-Radius r → Standardabweichung r/2, und 1 px im
      Entwurf = 1/1.68 Einheiten im Kopf-Raster → 0.6 / 2.38 / 5.95.
      Im direkten Bildvergleich mit dem Browser-Entwurf leuchtete das etwas
      schwächer. Deshalb hier nachjustiert: Schein 3 statt 2.38, Hof 7.5 statt
      5.95, und der Ultramarin-Schein wird doppelt gelegt (kräftigerer Lichtring).
      Farbraum sRGB wie im Browser (linearRGB ließ das Innere grau wirken).
    -->
    <filter id="leuchten" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <!-- Schritt 1: heller Kern -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.6" result="unschaerfe1"/>
      <feFlood flood-color="#C8BEFF" flood-opacity="0.9"/>
      <feComposite in2="unschaerfe1" operator="in" result="schatten1"/>
      <feMerge result="stufe1"><feMergeNode in="schatten1"/><feMergeNode in="SourceGraphic"/></feMerge>
      <!-- Schritt 2: Ultramarin-Schein um Kopf + Kern -->
      <feGaussianBlur in="stufe1" stdDeviation="3" result="unschaerfe2"/>
      <feFlood flood-color="#5B4BFF" flood-opacity="1"/>
      <feComposite in2="unschaerfe2" operator="in" result="schatten2"/>
      <feMerge result="stufe2"><feMergeNode in="schatten2"/><feMergeNode in="schatten2"/><feMergeNode in="stufe1"/></feMerge>
      <!-- Schritt 3: weiter Magenta-Hof um alles -->
      <feGaussianBlur in="stufe2" stdDeviation="7.5" result="unschaerfe3"/>
      <feFlood flood-color="#C04DFF" flood-opacity="0.7"/>
      <feComposite in2="unschaerfe3" operator="in" result="schatten3"/>
      <feMerge><feMergeNode in="schatten3"/><feMergeNode in="stufe2"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(8 16) scale(1.68)" filter="url(#leuchten)">
    <!-- 1. Kopf füllen (Pfad ist unten am Hals offen – wie im Entwurf) -->
    <path d="M42 92 V79 C31 73 24 61 25 46 C26 27 40 14 57 14 C72 14 81 25 81 37 C81 41 80 44 82 47 L86 54 C87 56 86 58 83 58 V64 C83 68 80 70 76 70 H71 V92" fill="url(#kopfHimmel)"/>

    <!-- 2. Sternenstaub und Funkelsterne im Gehirnbereich -->
    <g clip-path="url(#kopfRand)">
      <circle cx="41.5" cy="43.8" r="0.90" fill="#A89CFF" opacity="0.85"/>
      <circle cx="34.6" cy="22.5" r="1.27" fill="#E08CFF" opacity="0.82"/>
      <circle cx="39.7" cy="50.7" r="1.03" fill="#A89CFF" opacity="0.76"/>
      <circle cx="66.4" cy="31.3" r="0.72" fill="#A89CFF" opacity="0.9"/>
      <circle cx="58.9" cy="24.6" r="1.21" fill="#FFFFFF" opacity="0.72"/>
      <circle cx="33.2" cy="56.6" r="0.98" fill="#A89CFF" opacity="0.89"/>
      <circle cx="68.8" cy="37.8" r="1.24" fill="#A89CFF" opacity="0.99"/>
      <circle cx="37.4" cy="36.6" r="0.63" fill="#A89CFF" opacity="0.69"/>
      <circle cx="70.6" cy="39.4" r="1.10" fill="#E08CFF" opacity="0.77"/>
      <circle cx="65.3" cy="45.0" r="1.03" fill="#A89CFF" opacity="0.83"/>
      <circle cx="68.2" cy="49.3" r="1.34" fill="#E08CFF"/>
      <circle cx="58.9" cy="28.5" r="1.29" fill="#FFFFFF" opacity="0.89"/>
      <circle cx="40.4" cy="55.3" r="1.06" fill="#E08CFF" opacity="0.65"/>
      <circle cx="51.3" cy="47.6" r="0.99" fill="#E08CFF" opacity="0.92"/>
      <!-- Vierzackige Funkelsterne: groß (weiß), mittel (magenta), klein (lila) -->
      <path d="M52 32 Q52 38 58 38 Q52 38 52 44 Q52 38 46 38 Q52 38 52 32 Z" fill="#FFFFFF"/>
      <path d="M64 24.5 Q64 28 67.5 28 Q64 28 64 31.5 Q64 28 60.5 28 Q64 28 64 24.5 Z" fill="#E08CFF"/>
      <path d="M42 49 Q42 52 45 52 Q42 52 42 55 Q42 52 39 52 Q42 52 42 49 Z" fill="#A89CFF"/>
    </g>

    <!-- 3. Leuchtkontur obendrauf -->
    <path d="M42 92 V79 C31 73 24 61 25 46 C26 27 40 14 57 14 C72 14 81 25 81 37 C81 41 80 44 82 47 L86 54 C87 56 86 58 83 58 V64 C83 68 80 70 76 70 H71 V92" fill="none" stroke="url(#kontur)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
